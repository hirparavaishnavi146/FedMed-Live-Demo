# Render Blueprint for the public FedMed demo.
#
# One service, one container, one origin: the API serves the built dashboard itself, so
# the browser makes same-origin requests. Nothing about the hostname is compiled into the
# frontend, and there is no CORS origin to configure.
#
# How this file gets used: Render dashboard -> New + -> Blueprint -> pick this
# repository (public, so no GitHub App or repo-admin step is involved) -> Apply.

services:
  - type: web
    name: fedmed-live
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free tier: 512 MB, 0.1 CPU. Sleeps after 15 minutes without traffic and takes about
    # a minute to wake. Nothing here needs durable storage: uploads are staged in the
    # system temp directory, which is ephemeral by design.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- OCR: why this deployment is a container, not a native Python runtime ------
      # tesseract-ocr and poppler-utils are installed in ./Dockerfile. pip cannot provide
      # them, so on a native runtime a scanned report — or a photograph of one, which is
      # what most people actually have — is reported as unreadable. In the container it is
      # read like any other report.
      #
      # --- AI-generated report sections ---------------------------------------------
      # These call an OpenAI-compatible endpoint. Add the key in the Render dashboard ->
      # this service -> Environment -> FEDMED_AI_API_KEY, then redeploy. It is NOT in this
      # file: this repository is public, so a committed key would be a published key.
      #
      # Without it those three sections report themselves unavailable, and every other
      # part of the analysis — extracted values, comparison, abnormality detection and
      # urgency from explicit warning terms — still works.
      - key: FEDMED_AI_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
      - key: FEDMED_AI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: FEDMED_AI_TIMEOUT_SECONDS
        value: "90"

# Deliberately NOT configured, and why:
#
#   FEDMED_API_KEYS -- unset means mutating and admin routes refuse with 503
#     auth_not_configured rather than silently allowing anonymous writes. The
#     medical-report routes are opened separately by FEDMED_MEDICAL_REPORTS_PUBLIC_DEMO,
#     which ./Dockerfile sets, because a Vite build compiles every VITE_ value into the
#     JavaScript a browser downloads, so an API key can never be shipped to the page.
#   FEDMED_CORS_ORIGINS -- not needed with a single origin. A wrong value is worse than
#     omitting it.
#   FEDMED_SECURE_AGGREGATION_SECRET -- unset keeps secure aggregation inactive rather
#     than running with a guessable secret.
#   FEDMED_TLS_CERT_FILE / FEDMED_TLS_KEY_FILE -- Render terminates TLS at the edge.
#
# TRAINING IS NOT AVAILABLE HERE: torch is not installed, so POST /api/v1/training/start
# answers 503 training_unavailable. That is the honest answer, not a bug.
#
# An older native-Python service from an earlier attempt is NOT managed by this file.
# Delete it from its own Settings page once this one is verified, so only one demo exists.
#
# frontend/dist IS COMMITTED. The container has no Node, so rebuild it after any frontend
# change and push:
#
#     cd frontend
#     VITE_API_SAME_ORIGIN=true VITE_API_BASE_URL="" VITE_USE_DEMO_DATA=false \
#     VITE_HASH_ROUTER=false VITE_API_KEY="" VITE_API_TIMEOUT_SECONDS=75 \
#     VITE_API_REPORT_TIMEOUT_SECONDS=180 npm run build
